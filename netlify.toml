[build]
  command = "npm ci && npm run build"
  publish = "site"
  functions = "deploy-functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

# Schedule via free external cron (cron-job.org) hitting the function URL
# every hour — Netlify free scheduled functions can return 403 on HTTP invoke.

[[redirects]]
  from = "/api/fpl"
  to = "/.netlify/functions/fpl"
  status = 200
  force = true

[[redirects]]
  from = "/api/votes"
  to = "/.netlify/functions/votes"
  status = 200
  force = true

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
  force = true

[[redirects]]
  from = "/api/members"
  to = "/.netlify/functions/members"
  status = 200
  force = true

[[redirects]]
  from = "/api/matchday-digest"
  to = "/.netlify/functions/matchday-digest"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"


[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/api/account"
  to = "/.netlify/functions/account"
  status = 200
  force = true

[[redirects]]
  from = "/api/billing"
  to = "/.netlify/functions/billing"
  status = 200
  force = true

[[redirects]]
  from = "/api/paypal-webhook"
  to = "/.netlify/functions/paypal-webhook"
  status = 200
  force = true

[[redirects]]
  from = "/api/coach"
  to = "/.netlify/functions/coach"
  status = 200
  force = true

