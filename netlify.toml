[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/fpl"
  to = "/.netlify/functions/fpl"
  status = 200
  force = true

[[redirects]]
  from = "/api/votes"
  to = "/.netlify/functions/votes"
  status = 200
  force = true

[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200
  force = true

[[redirects]]
  from = "/api/matchday-digest"
  to = "/.netlify/functions/matchday-digest"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
